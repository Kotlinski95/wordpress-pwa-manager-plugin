name: Release

on:
  push:
    tags: ['v*']

permissions: {}

env:
  PLUGIN_SLUG: wordpress-pwa-manager

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          chmod +x /usr/local/bin/wp
          wp --info --allow-root
      - run: npm ci
      - run: npm run build
      - run: composer install --no-dev -o --prefer-dist --no-interaction
      - run: node bin/check-version.mjs
      - run: |
          mkdir -p dist
          node bin/release-notes.mjs "${GITHUB_REF_NAME}" > dist/release-notes.md
      - run: |
          wp i18n make-pot . languages/${PLUGIN_SLUG}.pot --include=includes,build,wordpress-pwa-manager.php --allow-root
          wp i18n make-json languages --no-purge --allow-root
          node bin/fix-i18n-json.mjs
      - run: |
          mkdir -p "dist/${PLUGIN_SLUG}"
          rsync -a --exclude-from=.distignore ./ "dist/${PLUGIN_SLUG}/" --exclude=dist
          (cd dist && zip -qr "${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}")
      - run: |
          listing=$(unzip -Z1 "dist/${PLUGIN_SLUG}.zip")
          for required in build/frontend.js build/frontend.css build/admin.js build/admin.css vendor/autoload.php wordpress-pwa-manager.php; do
            if ! grep -qx "${PLUGIN_SLUG}/${required}" <<< "$listing"; then
              echo "Missing ${required} in zip" >&2
              exit 1
            fi
          done
      - run: |
          cd dist
          sha256sum "${PLUGIN_SLUG}.zip" > "${PLUGIN_SLUG}.zip.sha256"
          sha256sum --check "${PLUGIN_SLUG}.zip.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: |
            dist/${{ env.PLUGIN_SLUG }}.zip
            dist/${{ env.PLUGIN_SLUG }}.zip.sha256
            dist/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/${{ env.PLUGIN_SLUG }}.zip
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: |
            dist/${{ env.PLUGIN_SLUG }}.zip
            dist/${{ env.PLUGIN_SLUG }}.zip.sha256
          body_path: dist/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          for required in "${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}.zip.sha256"; do
            grep -qx "${required}" <<< "${assets}" || {
              echo "Release asset ${required} missing" >&2
              exit 1
            }
          done
